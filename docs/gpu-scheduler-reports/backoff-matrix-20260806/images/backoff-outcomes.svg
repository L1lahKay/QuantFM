<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Job backoffLimit outcomes</title>
  <desc id="desc">backoffLimit zero creates one failed pod, one creates a failed and a successful pod, and two creates two failed pods followed by one successful pod.</desc>
  <rect width="1100" height="470" fill="#f8fafc"/>
  <text x="55" y="50" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">backoffLimit controls the retry budget</text>
  <text x="55" y="79" font-family="sans-serif" font-size="15" fill="#475569">One GPU per Job · restartPolicy: Never · different Pod UID for every box</text>

  <text x="55" y="145" font-family="monospace" font-size="18" font-weight="700" fill="#334155">backoffLimit: 0</text>
  <rect x="265" y="111" width="175" height="58" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="352" y="136" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9f1239">Pod 1 · exit 137</text>
  <text x="352" y="157" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#be123c">injected failure</text>
  <line x1="455" y1="140" x2="605" y2="140" stroke="#64748b" stroke-width="3"/>
  <polygon points="605,140 590,132 590,148" fill="#64748b"/>
  <text x="630" y="146" font-family="sans-serif" font-size="16" font-weight="700" fill="#9f1239">Job Failed</text>

  <text x="55" y="255" font-family="monospace" font-size="18" font-weight="700" fill="#334155">backoffLimit: 1</text>
  <rect x="265" y="221" width="175" height="58" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="352" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9f1239">Pod 1 · exit 137</text>
  <text x="352" y="267" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#be123c">injected failure</text>
  <line x1="440" y1="250" x2="495" y2="250" stroke="#64748b" stroke-width="3"/>
  <polygon points="495,250 480,242 480,258" fill="#64748b"/>
  <rect x="510" y="221" width="175" height="58" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="597" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#065f46">Pod 2 · exit 0</text>
  <text x="597" y="267" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#047857">CUDA success</text>
  <line x1="700" y1="250" x2="790" y2="250" stroke="#64748b" stroke-width="3"/>
  <polygon points="790,250 775,242 775,258" fill="#64748b"/>
  <text x="815" y="256" font-family="sans-serif" font-size="16" font-weight="700" fill="#065f46">Complete</text>

  <text x="55" y="365" font-family="monospace" font-size="18" font-weight="700" fill="#334155">backoffLimit: 2</text>
  <rect x="265" y="331" width="155" height="58" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="342" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9f1239">Pod 1 · 137</text>
  <text x="342" y="377" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#be123c">failure</text>
  <line x1="420" y1="360" x2="458" y2="360" stroke="#64748b" stroke-width="3"/>
  <polygon points="458,360 444,352 444,368" fill="#64748b"/>
  <rect x="470" y="331" width="155" height="58" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="547" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9f1239">Pod 2 · 137</text>
  <text x="547" y="377" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#be123c">failure</text>
  <line x1="625" y1="360" x2="663" y2="360" stroke="#64748b" stroke-width="3"/>
  <polygon points="663,360 649,352 649,368" fill="#64748b"/>
  <rect x="675" y="331" width="155" height="58" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="752" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#065f46">Pod 3 · 0</text>
  <text x="752" y="377" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#047857">CUDA success</text>
  <line x1="830" y1="360" x2="895" y2="360" stroke="#64748b" stroke-width="3"/>
  <polygon points="895,360 881,352 881,368" fill="#64748b"/>
  <text x="915" y="366" font-family="sans-serif" font-size="16" font-weight="700" fill="#065f46">Complete</text>

  <line x1="55" y1="430" x2="1045" y2="430" stroke="#cbd5e1"/>
  <text x="55" y="454" font-family="sans-serif" font-size="13" fill="#64748b">Source: summary.json and UID-linked Pod/container evidence, run bo260806a.</text>
</svg>
