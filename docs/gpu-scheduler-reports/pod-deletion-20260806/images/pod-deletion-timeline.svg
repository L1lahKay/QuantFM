<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Pod deletion experiment timeline</title>
  <desc id="desc">Timeline from Job creation through step 75, deletion request, old Pod disappearance, replacement start, and Job completion.</desc>
  <rect width="1100" height="390" fill="#f8fafc"/>
  <text x="55" y="50" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Client and workload timeline</text>
  <text x="55" y="79" font-family="sans-serif" font-size="15" fill="#475569">Offset from client-observed Job creation · total 42.447 s to Complete observation</text>

  <line x1="85" y1="190" x2="1015" y2="190" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

  <circle cx="85" cy="190" r="10" fill="#2563eb"/>
  <line x1="85" y1="180" x2="85" y2="125" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Job created</text>
  <text x="85" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">0.000 s</text>

  <circle cx="303" cy="190" r="9" fill="#f59e0b"/>
  <line x1="303" y1="200" x2="303" y2="255" stroke="#f59e0b" stroke-width="2"/>
  <text x="303" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#92400e">Step 75 marker</text>
  <text x="303" y="299" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">9.956 s</text>

  <circle cx="344" cy="190" r="10" fill="#ea580c"/>
  <line x1="344" y1="180" x2="344" y2="125" stroke="#ea580c" stroke-width="2"/>
  <text x="390" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9a3412">Delete requested</text>
  <text x="390" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">11.640 s</text>

  <circle cx="518" cy="190" r="9" fill="#dc2626"/>
  <line x1="518" y1="200" x2="518" y2="255" stroke="#dc2626" stroke-width="2"/>
  <text x="518" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">Old Pod absent</text>
  <text x="518" y="299" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">19.777 s</text>

  <circle cx="605" cy="190" r="10" fill="#059669"/>
  <line x1="605" y1="180" x2="605" y2="125" stroke="#059669" stroke-width="2"/>
  <text x="650" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#065f46">Replacement starts</text>
  <text x="650" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">23.630 s</text>

  <circle cx="1015" cy="190" r="11" fill="#047857"/>
  <line x1="1015" y1="200" x2="1015" y2="255" stroke="#047857" stroke-width="2"/>
  <text x="1015" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#065f46">Job Complete</text>
  <text x="1015" y="299" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">42.447 s</text>

  <line x1="55" y1="338" x2="1045" y2="338" stroke="#cbd5e1"/>
  <text x="55" y="366" font-family="sans-serif" font-size="12" fill="#64748b">API timestamps have one-second precision; the report keeps API Wall Clock (43 s) separate from client offsets.</text>
</svg>
