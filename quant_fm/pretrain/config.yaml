# OrderFlow FM 预训练配置（试点默认值）。
# 每次运行会在检查点旁快照本文件，以保证可复现。

seed: 42

data:
  manifest: quant_fm/data/manifest.json
  vocab: quant_fm/data/vocab.json
  context: 2048
  stride: 2048          # 非重叠窗口
  min_len: 16
  cache_size: 8
  num_workers: 4

model:
  d_model: 256          # 试点约 5–15M；全市场约 80–120M 可用 512 + n_layers 10
  n_layers: 6
  n_heads: 8
  ffn_mult: 4.0
  dropout: 0.1
  max_seq_len: 4096
  rope_theta: 10000.0
  # input_fields / target_fields 默认为全部 / 6 个预测头字段

optim:
  lr: 5.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 500
  max_steps: 20000
  batch_size: 8
  grad_accum: 4
  precision: bf16       # bf16 | fp16 | fp32

runtime:
  out_dir: quant_fm/runs/pilot
  log_every: 20
  eval_every: 500
  ckpt_every: 1000
  save_best: true       # val_loss 刷新最优时自动覆盖 best.pt
  fsdp: false           # 单节点多 GPU 时设为 true
  device: auto          # auto | cuda | cpu
