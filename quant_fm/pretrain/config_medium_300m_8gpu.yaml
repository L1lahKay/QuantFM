# ~300M OrderFlow FM（Chinchilla：D_train≈6B → 全市场约 22 交易日）
# 数据：quant_fm/runs/medium_300m（MinIO 读 zeus-cn-quote → tokens）
# 实测参数：d_model=1024 × n_layers=18 ≈ 302.30M
#
# 启动：
#   bash quant_fm/scripts/run_minio_300m_pipeline.sh

seed: 42

data:
  manifest: quant_fm/runs/medium_300m/data/manifest.json
  vocab: quant_fm/runs/medium_300m/data/vocab.json
  context: 2048
  stride: 2048
  min_len: 16
  cache_size: 32
  num_workers: 8

model:
  d_model: 1024
  n_layers: 18
  n_heads: 16
  ffn_mult: 4.0
  dropout: 0.1
  max_seq_len: 4096
  rope_theta: 10000.0

optim:
  lr: 2.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 1500
  # 加速（实测 batch=8 步速降至 ~1.25/s，墙钟无收益；回退 batch=4）：
  # - batch=4/accum=2 → 有效 batch=64，约 2.3 step/s，显存 ~17GB
  # - max_steps=40000 ≈ 1.1 epoch（2.35M windows / 64）
  max_steps: 40000
  batch_size: 4
  grad_accum: 2
  precision: bf16

runtime:
  out_dir: quant_fm/runs/medium_300m/run
  log_every: 50
  eval_every: 2000
  save_best: true
  ckpt_every: 4000
  fsdp: true
  device: cuda
