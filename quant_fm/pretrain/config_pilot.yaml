# OrderFlow FM pilot 预训练配置（单卡）。
# 前提：先运行 make pilot 或 quant_fm.scripts.run_pilot，生成 manifest 与 vocab。
#
# 单卡启动：
#   python -m quant_fm.pretrain.train --config quant_fm/pretrain/config_pilot.yaml
#
# 8 卡启动：
#   bash quant_fm/scripts/train_pilot_8gpu.sh

seed: 42

data:
  manifest: quant_fm/runs/pilot/data/manifest.json
  vocab: quant_fm/runs/pilot/data/vocab.json
  context: 2048
  stride: 2048          # 非重叠窗口
  min_len: 16
  cache_size: 8
  num_workers: 4

model:
  d_model: 256          # pilot ≈ 6M 参数
  n_layers: 6
  n_heads: 8
  ffn_mult: 4.0
  dropout: 0.1
  max_seq_len: 4096
  rope_theta: 10000.0

optim:
  lr: 5.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 500
  max_steps: 20000
  batch_size: 16        # 单卡 batch
  grad_accum: 2         # 有效 batch = 16 × 2 = 32 序列
  precision: bf16       # RTX 5090 推荐 bf16

runtime:
  out_dir: quant_fm/runs/pilot/run
  log_every: 20
  eval_every: 500
  save_best: true
  ckpt_every: 1000
  fsdp: false
  device: cuda
