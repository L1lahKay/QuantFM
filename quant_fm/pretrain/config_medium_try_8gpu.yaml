# medium 试跑：5 交易日 × 每市场 30 股（验证 medium 流水线 + 训练）
# 读 zeus-cn-quote @ :9000，训练日志 quant_fm/runs/medium_try/run/

seed: 42

data:
  manifest: quant_fm/runs/medium_try/data/manifest.json
  vocab: quant_fm/runs/medium_try/data/vocab.json
  context: 2048
  stride: 2048
  min_len: 16
  cache_size: 8
  num_workers: 2

model:
  d_model: 512
  n_layers: 10
  n_heads: 8
  ffn_mult: 4.0
  dropout: 0.1
  max_seq_len: 4096
  rope_theta: 10000.0

optim:
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 500
  max_steps: 10000
  batch_size: 8
  grad_accum: 2
  precision: bf16

runtime:
  out_dir: quant_fm/runs/medium_try/run
  log_every: 20
  eval_every: 500
  save_best: true
  ckpt_every: 2000
  fsdp: true
  device: cuda
