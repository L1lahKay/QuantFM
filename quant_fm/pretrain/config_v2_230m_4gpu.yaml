# QuantFM V2 Dense 230M：gpu-dev 四卡正式配置。
#
# 与 config_v2_230m.yaml 保持相同模型、数据和 50,000-update 预算；四卡时把
# grad_accum 从 8 提到 16，使全局有效 batch 仍为 2 × 16 × 4 = 128 条序列。
schema_version: cn_l2_v2
seed: 42

data:
  manifest: quant_fm/runs/v2_shared/data/manifest.json
  vocab: quant_fm/runs/v2_shared/data/vocab_v2.json
  context: 2048
  stride: 2048
  min_len: 16
  cache_size: 32
  num_workers: 8
  shard_aware_sampler: true
  persistent_workers: true
  prefetch_factor: 2
  validation_plan: quant_fm/runs/v2_shared/validation_windows.json
  validation_seed: 42
  validation_windows: 800
  min_validation_dates: 5
  min_test_dates: 5

model:
  d_model: 1024
  n_layers: 18
  n_heads: 16
  ffn_hidden: 2816
  dropout: 0.05
  max_seq_len: 2048
  rope_theta: 10000.0
  field_fusion:
    method: gated_sum
    categorical_dim: 32
    field_dropout: 0.05
    input_norm: true
  backbone_moe:
    enabled: false

loss:
  normalize_by_train_entropy: true
  targets:
    tok_evt_type: {type: ce, weight: 1.0}
    tok_side: {type: ce, weight: 1.0}
    tok_price_bin: {type: ordinal_ce, weight: 1.0, ordinal_weight: 0.5}
    tok_volume_bin: {type: ordinal_ce, weight: 0.5, ordinal_weight: 0.25}
    tok_delta_t_bin: {type: ordinal_ce, weight: 0.5, ordinal_weight: 0.25}

book:
  state_timing: post_event

pooling:
  version: hierarchical_selected_v2
  method: multi_scale
  stride: 512
  outputs: [mean_all, last_256, continuous_pm, close_30m]

optim:
  lr: 2.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 2000
  max_update_steps: 50000
  micro_batch_size: 2
  grad_accum: 16
  precision: bf16

runtime:
  out_dir: quant_fm/runs/v2_dense_230m/run
  log_every: 25
  eval_every: 1000
  val_max_batches: 200
  ckpt_every: 2000
  save_best: true
  fsdp: true
  fsdp_no_sync: true
  device: cuda
