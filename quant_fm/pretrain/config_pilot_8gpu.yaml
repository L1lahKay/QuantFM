# OrderFlow FM pilot 预训练配置（8 卡 FSDP）。
# 与 config_pilot.yaml 相同数据路径；batch 按每卡计。
#
# 启动：
#   bash quant_fm/scripts/train_pilot_8gpu.sh

seed: 42

data:
  manifest: quant_fm/runs/pilot/data/manifest.json
  vocab: quant_fm/runs/pilot/data/vocab.json
  context: 2048
  stride: 2048
  min_len: 16
  cache_size: 8
  num_workers: 2        # 每卡 2 worker，8 卡共 16

model:
  d_model: 256
  n_layers: 6
  n_heads: 8
  ffn_mult: 4.0
  dropout: 0.1
  max_seq_len: 4096
  rope_theta: 10000.0

optim:
  lr: 5.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 500
  max_steps: 20000
  batch_size: 8         # 每卡 batch
  grad_accum: 2         # 有效 batch = 8 卡 × 8 × 2 = 128 序列
  precision: bf16

runtime:
  out_dir: quant_fm/runs/pilot/run
  log_every: 20
  eval_every: 500
  save_best: true
  ckpt_every: 1000
  fsdp: true
  device: cuda
