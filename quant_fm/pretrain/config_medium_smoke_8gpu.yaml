# medium-smoke：60 日 × 每市场 50 股

seed: 42

data:
  manifest: quant_fm/runs/medium_smoke/data/manifest.json
  vocab: quant_fm/runs/medium_smoke/data/vocab.json
  context: 2048
  stride: 2048
  min_len: 16
  cache_size: 8
  num_workers: 2

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  ffn_mult: 4.0
  dropout: 0.1
  max_seq_len: 4096
  rope_theta: 10000.0

optim:
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  warmup_steps: 1000
  max_steps: 50000
  batch_size: 8
  grad_accum: 2
  precision: bf16

runtime:
  out_dir: quant_fm/runs/medium_smoke/run
  log_every: 50
  eval_every: 1000
  save_best: true
  ckpt_every: 5000
  fsdp: true
  device: cuda
