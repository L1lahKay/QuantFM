# QuantFM training storage on the GPU node's /data filesystem.
#
# The local-path StorageClass is single-node storage with a Delete reclaim
# policy. Important checkpoints and delivery artifacts must still be backed up
# to MinIO or another independent store.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quantfm-data
  namespace: khalil
  labels:
    app.kubernetes.io/name: quantfm
    app.kubernetes.io/component: training-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 500Gi
---
# local-path uses WaitForFirstConsumer, so this one-shot Job both binds the PVC
# to gpu-dev-01 and creates the directory layout used by future workloads.
apiVersion: batch/v1
kind: Job
metadata:
  name: quantfm-data-init
  namespace: khalil
  labels:
    app.kubernetes.io/name: quantfm
    app.kubernetes.io/component: training-storage-init
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantfm
        app.kubernetes.io/component: training-storage-init
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      securityContext:
        runAsUser: 1006
        runAsGroup: 1009
        fsGroup: 1009
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: initialize
          image: ubuntu:22.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p \
                /mnt/quantfm/datasets \
                /mnt/quantfm/cache/huggingface \
                /mnt/quantfm/checkpoints \
                /mnt/quantfm/runs \
                /mnt/quantfm/outputs \
                /mnt/quantfm/tmp
              ls -ld /mnt/quantfm /mnt/quantfm/*
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: quantfm-data
              mountPath: /mnt/quantfm
      volumes:
        - name: quantfm-data
          persistentVolumeClaim:
            claimName: quantfm-data
