apiVersion: batch/v1
kind: Job
metadata:
  name: khalil-quantfm-training-template
  namespace: gpu-dev
  labels:
    app.kubernetes.io/name: quantfm
    app.kubernetes.io/component: training
    app.kubernetes.io/part-of: khalil-quantfm
    owner: khalil
spec:
  # This is a safe template, not a runnable training submission.
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantfm
        app.kubernetes.io/component: training
        app.kubernetes.io/part-of: khalil-quantfm
        owner: khalil
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        accelerator: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        runAsGroup: 1009
        fsGroup: 1009
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: registry.zs/gpu-dev/khalil-quantfm:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/QuantFM
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              test -d /mnt/quantfm/runs
              mkdir -p \
                /mnt/quantfm/cache/home \
                /mnt/quantfm/cache/huggingface \
                /mnt/quantfm/cache/torch \
                /mnt/quantfm/cache/triton \
                /mnt/quantfm/cache/cuda \
                /mnt/quantfm/tmp
              exec python -m quant_fm.pretrain.train \
                --config REPLACE_CONFIG
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /mnt/quantfm/cache/home
            - name: TMPDIR
              value: /mnt/quantfm/tmp
            - name: XDG_CACHE_HOME
              value: /mnt/quantfm/cache
            - name: HF_HOME
              value: /mnt/quantfm/cache/huggingface
            - name: TORCH_HOME
              value: /mnt/quantfm/cache/torch
            - name: TRITON_CACHE_DIR
              value: /mnt/quantfm/cache/triton
            - name: CUDA_CACHE_PATH
              value: /mnt/quantfm/cache/cuda
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: training-data
              mountPath: /mnt/quantfm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: training-data
          persistentVolumeClaim:
            # Administrator confirmation is required before real submission.
            claimName: quantfm-data
