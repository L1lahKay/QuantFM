apiVersion: batch/v1
kind: Job
metadata:
  generateName: khalil-cpu-pvc-smoke-
  namespace: gpu-dev
  labels:
    app.kubernetes.io/name: quantfm
    app.kubernetes.io/component: cpu-pvc-smoke
    app.kubernetes.io/part-of: khalil-quantfm
    owner: khalil
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantfm
        app.kubernetes.io/component: cpu-pvc-smoke
        app.kubernetes.io/part-of: khalil-quantfm
        owner: khalil
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      # The retained local PV is tied to the NVIDIA node. This Job requests no
      # GPU, but it needs the selector and toleration to reach that PVC.
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        runAsGroup: 1009
        fsGroup: 1009
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: registry.zs/gpu-dev/khalil-quantfm:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/QuantFM
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              test -d /mnt/quantfm/runs
              test "$(readlink -f /workspace/QuantFM/quant_fm/runs)" = \
                   "$(readlink -f /mnt/quantfm/runs)"
              test "$(readlink -f /home/khalil/DataCleaning7.3/QuantFM/quant_fm/runs)" = \
                   "$(readlink -f /mnt/quantfm/runs)"

              mkdir -p /mnt/quantfm/cache/home /mnt/quantfm/tmp
              probe="/mnt/quantfm/tmp/cpu-smoke-${HOSTNAME}"
              trap 'rm -f "${probe}"' EXIT
              printf 'cpu-pvc-smoke\n' > "${probe}"
              test "$(cat "${probe}")" = cpu-pvc-smoke

              python - <<'PY'
              from pathlib import Path

              assert Path("quant_fm/runs").resolve() == Path("/mnt/quantfm/runs")
              import quant_fm  # noqa: F401
              print("python_import=ok")
              PY
              df -h /mnt/quantfm
              echo CPU_PVC_SMOKE_PASS
          env:
            - name: HOME
              value: /mnt/quantfm/cache/home
            - name: TMPDIR
              value: /mnt/quantfm/tmp
            - name: XDG_CACHE_HOME
              value: /mnt/quantfm/cache
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: quantfm-data
              mountPath: /mnt/quantfm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: quantfm-data
          persistentVolumeClaim:
            claimName: quantfm-data
