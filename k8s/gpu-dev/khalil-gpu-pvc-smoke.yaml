apiVersion: batch/v1
kind: Job
metadata:
  generateName: khalil-gpu-pvc-smoke-
  namespace: gpu-dev
  labels:
    app.kubernetes.io/name: quantfm
    app.kubernetes.io/component: gpu-pvc-smoke
    app.kubernetes.io/part-of: khalil-quantfm
    owner: khalil
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantfm
        app.kubernetes.io/component: gpu-pvc-smoke
        app.kubernetes.io/part-of: khalil-quantfm
        owner: khalil
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        runAsGroup: 1009
        fsGroup: 1009
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: registry.zs/gpu-dev/khalil-quantfm:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/QuantFM
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              test -d /mnt/quantfm/runs
              test "$(readlink -f /workspace/QuantFM/quant_fm/runs)" = \
                   "$(readlink -f /mnt/quantfm/runs)"
              test "$(readlink -f /home/khalil/DataCleaning7.3/QuantFM/quant_fm/runs)" = \
                   "$(readlink -f /mnt/quantfm/runs)"

              mkdir -p \
                /mnt/quantfm/cache/home \
                /mnt/quantfm/cache/huggingface \
                /mnt/quantfm/cache/torch \
                /mnt/quantfm/cache/triton \
                /mnt/quantfm/cache/cuda \
                /mnt/quantfm/tmp
              probe="/mnt/quantfm/tmp/gpu-smoke-${HOSTNAME}"
              trap 'rm -f "${probe}"' EXIT
              printf 'gpu-pvc-smoke\n' > "${probe}"
              test "$(cat "${probe}")" = gpu-pvc-smoke

              df -h /mnt/quantfm
              nvidia-smi --query-gpu=name,uuid,memory.total --format=csv,noheader
              python - <<'PY'
              import torch

              assert torch.cuda.is_available(), "torch cannot see an NVIDIA GPU"
              assert torch.cuda.device_count() >= 1
              x = torch.arange(8, device="cuda", dtype=torch.float32)
              assert x.sum().item() == 28.0
              print(f"torch={torch.__version__}")
              print(f"cuda_build={torch.version.cuda}")
              print(f"gpu={torch.cuda.get_device_name(0)}")
              PY
              echo GPU_PVC_SMOKE_PASS
          env:
            - name: HOME
              value: /mnt/quantfm/cache/home
            - name: TMPDIR
              value: /mnt/quantfm/tmp
            - name: XDG_CACHE_HOME
              value: /mnt/quantfm/cache
            - name: HF_HOME
              value: /mnt/quantfm/cache/huggingface
            - name: TORCH_HOME
              value: /mnt/quantfm/cache/torch
            - name: TRITON_CACHE_DIR
              value: /mnt/quantfm/cache/triton
            - name: CUDA_CACHE_PATH
              value: /mnt/quantfm/cache/cuda
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "1"
              memory: 2Gi
            limits:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: quantfm-data
              mountPath: /mnt/quantfm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: quantfm-data
          persistentVolumeClaim:
            claimName: quantfm-data
