apiVersion: batch/v1
kind: Job
metadata:
  generateName: khalil-training-pvc-smoke-
  namespace: gpu-dev
  labels:
    app.kubernetes.io/name: quantfm
    app.kubernetes.io/component: training-pvc-smoke
    app.kubernetes.io/part-of: khalil-quantfm
    owner: khalil
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantfm
        app.kubernetes.io/component: training-pvc-smoke
        app.kubernetes.io/part-of: khalil-quantfm
        owner: khalil
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      runtimeClassName: nvidia
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        runAsGroup: 1009
        fsGroup: 1009
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: registry.zs/gpu-dev/khalil-quantfm:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/QuantFM
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              test -d /mnt/quantfm/runs/pilot/data
              test -d /mnt/quantfm/runs/pilot/tokens
              mkdir -p \
                /mnt/quantfm/cache/home \
                /mnt/quantfm/cache/huggingface \
                /mnt/quantfm/cache/torch \
                /mnt/quantfm/cache/triton \
                /mnt/quantfm/cache/cuda \
                /mnt/quantfm/tmp \
                /mnt/quantfm/runs/k8s_pvc_smoke

              run_id="${HOSTNAME}"
              out_dir="/mnt/quantfm/runs/k8s_pvc_smoke/${run_id}"
              config_file="/mnt/quantfm/tmp/config-${run_id}.yaml"
              test ! -e "${out_dir}"
              sed "s/RUNTIME_RUN_ID/${run_id}/g" \
                quant_fm/pretrain/config_k8s_pvc_smoke.yaml \
                > "${config_file}"

              python -m quant_fm.pretrain.train --config "${config_file}"
              test -s "${out_dir}/step1.pt"
              test -s "${out_dir}/final_resume.pt"
              test -s "${out_dir}/final.pt"

              python -m quant_fm.pretrain.train \
                --config "${config_file}" \
                --resume auto
              test -s "${out_dir}/final_resume.pt"
              echo "checkpoint_dir=${out_dir}"
              echo TRAINING_CHECKPOINT_RESUME_PASS
          env:
            - name: HOME
              value: /mnt/quantfm/cache/home
            - name: TMPDIR
              value: /mnt/quantfm/tmp
            - name: XDG_CACHE_HOME
              value: /mnt/quantfm/cache
            - name: HF_HOME
              value: /mnt/quantfm/cache/huggingface
            - name: TORCH_HOME
              value: /mnt/quantfm/cache/torch
            - name: TRITON_CACHE_DIR
              value: /mnt/quantfm/cache/triton
            - name: CUDA_CACHE_PATH
              value: /mnt/quantfm/cache/cuda
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "2"
              memory: 4Gi
            limits:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: quantfm-data
              mountPath: /mnt/quantfm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: quantfm-data
          persistentVolumeClaim:
            claimName: quantfm-data
