apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: khalil-kueue-eval
  labels:
    evaluation.quantfm/owner: khalil
    evaluation.quantfm/purpose: scheduler-benchmark-runtime
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: gpu-dev
  queueingStrategy: StrictFIFO
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: khalil-kueue-nvidia
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: 16Gi
            - name: nvidia.com/gpu
              nominalQuota: "4"
