apiVersion: v1
kind: ResourceQuota
metadata:
  name: bare-gpu-quota
  namespace: khalil-quota-bench
  labels:
    owner: khalil
    experiment: bare-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 16Gi
    requests.nvidia.com/gpu: "1"
    limits.cpu: "8"
    limits.memory: 32Gi
    limits.nvidia.com/gpu: "1"
