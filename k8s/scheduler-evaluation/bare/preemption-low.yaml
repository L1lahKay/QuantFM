apiVersion: v1
kind: Pod
metadata:
  name: bare-preempt-low-5gpu
  namespace: khalil-scheduler-bench
  labels:
    owner: khalil
    experiment: bare-preemption
    role: victim
spec:
  priorityClassName: khalil-bench-low
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    accelerator: nvidia
  terminationGracePeriodSeconds: 0
  containers:
    - name: low
      image: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          echo "LOW_START $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 60
          echo "LOW_END $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
          nvidia.com/gpu: "5"
        limits:
          cpu: 500m
          memory: 256Mi
          nvidia.com/gpu: "5"
