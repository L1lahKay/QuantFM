apiVersion: batch/v1
kind: Job
metadata:
  name: khalil-bare-quota-waiter
  namespace: gpu-dev
  labels:
    owner: khalil
    experiment: bare-current-quota
    role: waiter
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        owner: khalil
        experiment: bare-current-quota
        role: waiter
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      schedulerName: default-scheduler
      runtimeClassName: nvidia
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 0
      containers:
        - name: waiter
          image: registry.zs/gpu-dev/dylan-trainer:ac4218e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              python - <<'PY'
              import datetime
              import time
              import torch

              print(f"APP_START_UTC={datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')}", flush=True)
              count = torch.cuda.device_count()
              print(f"VISIBLE_GPU_COUNT={count}", flush=True)
              assert count == 1, count
              value = torch.tensor([20, 22], device="cuda").sum()
              torch.cuda.synchronize()
              print(f"CUDA_TENSOR_RESULT={int(value.item())}", flush=True)
              time.sleep(4)
              print(f"APP_FINISH_UTC={datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')}", flush=True)
              PY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 2Gi
              nvidia.com/gpu: "1"
