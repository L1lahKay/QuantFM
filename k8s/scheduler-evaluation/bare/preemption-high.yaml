apiVersion: v1
kind: Pod
metadata:
  name: bare-preempt-high-5gpu
  namespace: khalil-scheduler-bench
  labels:
    owner: khalil
    experiment: bare-preemption
    role: preemptor
spec:
  priorityClassName: khalil-bench-high
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    accelerator: nvidia
  terminationGracePeriodSeconds: 0
  containers:
    - name: high
      image: ubuntu:22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          echo "HIGH_START $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "VISIBLE_GPUS $(nvidia-smi -L | wc -l)"
          sleep 10
          echo "HIGH_END $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
          nvidia.com/gpu: "5"
        limits:
          cpu: 500m
          memory: 256Mi
          nvidia.com/gpu: "5"
