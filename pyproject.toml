[project]
name = "quant-fm"
description = "A-share order-flow foundation model training pipeline"
readme = "README.md"
authors = [{ name = "Mirac-Le", email = "iwnlgre@outlook.com" }]
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "pylob",
    "minio>=7.2.20",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "polars>=1.35.1",
    "pyarrow>=23.0.0",
    "sortedcontainers>=2.4.0",
    #"zeus-quant[data,cloud]"
]

[project.optional-dependencies]
# Foundation-model training stack (quant_fm.pretrain / embedding / downstream).
# Install with:  uv sync --extra fm   (or)  pip install -e ".[fm]"
fm = [
    "torch>=2.2.0",
    "pyyaml>=6.0",
    "tensorboard>=2.16.0",
]

# static type checker <mypy or incoming astral.ty>

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # flake8-docstrings
    "D213",   # Augment NumPy docstring convention: Multi-line docstring summary should start at the second line
    "D417",   # Augment NumPy docstring convention: Missing argument descriptions
    "I",      # isort
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific rules
    "PTH",    # flake8-use-pathlib
    "FA",     # flake8-future-annotations
    "PIE",    # flake8-pie
    "TD",     # flake8-todos
    "TRY",    # tryceratops
    "EM",     # flake8-errmsg
    "FBT001", # flake8-boolean-trap
]

ignore = [
    # Line length regulated by formatter
    "E501",
    # pydocstyle: http://www.pydocstyle.org/en/stable/error_codes.html
    "D401", # Relax NumPy docstring convention: First line should be in imperative mood
    # flake8-pytest-style:
    "PT011", # pytest.raises({exception}) is too broad, set the match parameter or use a more specific exception
    # flake8-simplify
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM108", # Use ternary operator
    # ruff
    "RUF005", # unpack-instead-of-concatenating-to-collection-literal
    # Allow fullwidth punctuation in Chinese comments/docstrings/strings (RUF00x flags ASCII lookalikes)
    "RUF001",
    "RUF002",
    "RUF003",
    # pycodestyle
    # TODO: Remove errors below to further improve docstring linting
    # Ordered from most common to least common errors.
    "D105", # Missing docstring in magic method
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    # flake8-todos
    "TD002", # Missing author in TODO
    "TD003", # Missing issue link on the line following this TODO
    # tryceratops
    "TRY003", # Avoid specifying long messages outside the exception class
    # Lints below are turned off because of conflicts with the ruff formatter
    "D206",
    "W191",
    "TID252", # Prefer absolute imports over relative imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D102", "D103", "B018", "FBT001", "D400", "D415"]
"quant_fm/**/*.py" = ["D400", "D415"]  # 中文 docstring 以句号结尾，非英文句点

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# [tool.ruff.lint.flake8-tidy-imports]
# ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
docstring-code-format = true

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.3.4",
    "pytest>=9.0.3",
    "ruff>=0.15.21",
]

[tool.uv.build-backend]
module-name = "quant_fm"
module-root = ""

[tool.uv]
managed = true

[tool.uv.sources]
pylob = { workspace = true }
# Optional private dependency (enable only when needed + CI has access):
# zeus-quant = { git = "ssh://git@github.com/zeusamc/zeus-quant.git" }

[tool.uv.workspace]
members = ["order_book"]

[[tool.uv.index]]
name = 'aliyun-pypi'
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = 'zeusamc-dev'
url = "http://zeus-ops-acs:3141/zeusamc/dev/+simple"
publish-url = "http://zeus-ops-acs:3141/zeusamc/dev/"
explicit = true
