<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Pod process failure and Kubernetes Job retry chain</title>
  <desc id="desc">The first pod exited 137 after process termination. The Job controller created a second pod with a different UID, which completed CUDA training and exited 0.</desc>
  <rect width="1000" height="360" fill="#f8fafc"/>
  <text x="50" y="48" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">Pod process failure → Job retry → CUDA success</text>
  <text x="50" y="76" font-family="sans-serif" font-size="15" fill="#475569">Job khalil-pod-retry-retry260810 · 2026-08-06 UTC</text>

  <rect x="50" y="112" width="320" height="174" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="74" y="145" font-family="sans-serif" font-size="19" font-weight="700" fill="#9f1239">First Pod</text>
  <text x="74" y="176" font-family="monospace" font-size="13" fill="#334155">...-gmxzc</text>
  <text x="74" y="202" font-family="monospace" font-size="12" fill="#64748b">UID bd60ec4e-...-5a1aa46</text>
  <text x="74" y="235" font-family="sans-serif" font-size="16" fill="#334155">Python process killed</text>
  <text x="74" y="263" font-family="sans-serif" font-size="20" font-weight="700" fill="#be123c">exit 137</text>

  <line x1="390" y1="199" x2="604" y2="199" stroke="#475569" stroke-width="4"/>
  <polygon points="604,199 584,188 584,210" fill="#475569"/>
  <text x="417" y="174" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Job controller retry</text>
  <text x="424" y="229" font-family="sans-serif" font-size="14" fill="#64748b">backoffLimit: 1</text>

  <rect x="630" y="112" width="320" height="174" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="654" y="145" font-family="sans-serif" font-size="19" font-weight="700" fill="#065f46">Retry Pod</text>
  <text x="654" y="176" font-family="monospace" font-size="13" fill="#334155">...-82fzl</text>
  <text x="654" y="202" font-family="monospace" font-size="12" fill="#64748b">UID ec4abe5c-...-ad719952c034</text>
  <text x="654" y="235" font-family="sans-serif" font-size="16" fill="#334155">80 timed CUDA steps</text>
  <text x="654" y="263" font-family="sans-serif" font-size="20" font-weight="700" fill="#047857">exit 0 · Job Complete</text>

  <rect x="50" y="312" width="900" height="1" fill="#cbd5e1"/>
  <text x="50" y="338" font-family="sans-serif" font-size="14" fill="#475569">Validation: 2 owned Pods · different UIDs · one success marker · 11 associated Events</text>
</svg>
