apiVersion: batch/v1
kind: Job
metadata:
  name: khalil-nccl-probe
  namespace: gpu-dev
  labels:
    app.kubernetes.io/name: khalil-scheduler-benchmark
    benchmark.quantfm.io/scenario: nccl-four-gpu-probe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: khalil-scheduler-benchmark
        benchmark.quantfm.io/scenario: nccl-four-gpu-probe
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nccl-probe
          image: registry.zs/gpu-dev/dylan-trainer@sha256:9e7f7f8dc3c15c522408d1e8da38401ac224b99ddfba363078f40403eb456574
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              printf '%s' '' | base64 -d > /tmp/khalil_nccl_probe.py
              exec python -m torch.distributed.run --standalone --nnodes=1 --nproc-per-node=4 /tmp/khalil_nccl_probe.py
          env:
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_ASYNC_ERROR_HANDLING
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "4"
